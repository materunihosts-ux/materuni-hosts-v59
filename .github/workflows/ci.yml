name: Website build and quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Astro build and SEO quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build and run quality gate
        env:
          PUBLIC_SUPABASE_URL: https://sskmzswoeljxwojcszta.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_G9ru4P_yKzievqiXjXEEbQ_p28cB_NZ
        run: npm run build
