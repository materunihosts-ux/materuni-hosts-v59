name: Astro build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: astro-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Export generated dependency lockfile for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-lockfile-review
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Build, type-check and run website quality gate
        env:
          PUBLIC_SUPABASE_URL: https://sskmzswoeljxwojcszta.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_G9ru4P_yKzievqiXjXEEbQ_p28cB_NZ
        run: npm run build
      - name: Enforce dependency security threshold
        run: npm audit --audit-level=high

      - name: Package deployable website ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: materuni-hosts-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
