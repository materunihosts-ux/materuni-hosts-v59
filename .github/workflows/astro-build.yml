name: Astro build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: astro-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build, type-check and run website quality gate
        run: npm run build
      - name: Enforce dependency security threshold
        run: npm audit --audit-level=high

      - name: Package deployable website ZIP
        uses: actions/upload-artifact@v4
        with:
          name: materuni-hosts-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
