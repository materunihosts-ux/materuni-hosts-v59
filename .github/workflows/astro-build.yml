name: Astro build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency security audit
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); for (const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(name+" | "+v.severity+" | "+v.range+" | fix="+JSON.stringify(v.fixAvailable))'
      - run: npm run check
      - run: npm run build
